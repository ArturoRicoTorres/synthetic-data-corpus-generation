- id: T02
  name: Carry status and classification attributes into the enriched layer
  layer: enrichment
  inputs:
  - INSTRMNT_RL_IL.PRFRMNG_STTS
  - INSTRMNT_RL_IL.ACCNTNG_CLSSFCTN
  - PRTY_IL.INSTTTNL_SCTR
  - INSTRMNT_ENTTY_RL_ASSGNMNT_IL.ENTTY_RL_TYP
  - INTRNL_GRP_RL_IL.FNRP_RPRTNG_SCHM
  outputs:
