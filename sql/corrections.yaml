# ---------- Annex V type, instrument roles ----------
- routine: R_DER_TYP_FNNCL_ASST_INSTRMNT_ANNX_V_2
  kind: structure
  original: "Update EIL Cube -- Destination cube: INSTRMNT_RL_EIL\nset\nTYP_FNNCL_ASST_INSTRMNT_ANNX_V = \ncase ... else null;"
  corrected: "SELECT ... MAX(CASE ... END) FROM instrument role JOIN instrument LEFT JOIN entity-role assignment LEFT JOIN party LEFT JOIN hedge GROUP BY instrument role"
  reason: The routine reads attributes of five source cubes (named in its comments) but states no join. Joins use the official relationship keys. An instrument role with several assignments gets one type, taken over all assignments (only the qualifying assignment yields a non-null type).
  occurrences: 1
- routine: R_DER_TYP_FNNCL_ASST_INSTRMNT_ANNX_V_2
  kind: identifier
  original: "MN_DPST_DPST_TKNG_CRPRTN_INDCTR"
  corrected: "MN_DPST_TKNG_CRPRTN_INDCTR"
  reason: Variable does not exist in the export; MN_DPST_TKNG_CRPRTN_INDCTR is the main deposit-taking corporation indicator on INSTRMNT_ENTTY_RL_ASSGNMNT_IL named in the comment.
  occurrences: 3
- routine: R_DER_TYP_FNNCL_ASST_INSTRMNT_ANNX_V_2
  kind: identifier
  original: "MN_DPST_TKNG_CRPRTN_INCTR_1"
  corrected: "MN_DPST_TKNG_CRPRTN_INDCTR_1"
  reason: Member does not exist in the export (typo 'INCTR'); MN_DPST_TKNG_CRPRTN_INDCTR_1 is 'Main Deposit-taking corporation'.
  occurrences: 3
- routine: R_DER_TYP_FNNCL_ASST_INSTRMNT_ANNX_V_2
  kind: missing_variable
  original: "or TYP_INSTRMNT_1201 --Loan on demand used for minimum reserve"
  corrected: "OR i.INSTRMNT_TYP_PRDCT = 'TYP_INSTRMNT_1201'"
  reason: Member used as a predicate without its variable; TYP_INSTRMNT_1201 is a member of INSTRMNT_TYP_PRDCT.
  occurrences: 1
