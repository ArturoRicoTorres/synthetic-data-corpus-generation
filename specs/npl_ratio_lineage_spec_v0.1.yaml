transformations:
- id: T01
  name: Load instrument master
  layer: source
  inputs:
  - INSTRMNT.*
  outputs:
  - stg_instrument
  logic:
    type: select
    filter: DT_RFRNC = :reporting_date AND RPRTNG_AGNT_ID = :reporting_agent
  business_group: SOURCE_ACQUISITION
  provenance: gap_fill
  description: Snapshot of all instruments held by the reporting agent at the reference date.
- id: T02
  name: Load instrument role (accounting view)
  layer: source
  inputs:
  - INSTRMNT_RL.*
  outputs:
  - stg_instrument_role
  logic:
    type: select
    filter: DT_RFRNC = :reporting_date AND RPRTNG_AGNT_ID = :reporting_agent
  business_group: SOURCE_ACQUISITION
  provenance: gap_fill
- id: T03
  name: Derive gross carrying amount
  layer: enrichment
  inputs:
  - INSTRMNT_RL.INSTRMNT_RL_TYP
  - INSTRMNT_RL.ACCNTNG_CLSSFCTN
  - INSTRMNT_RL.CRRYNG_AMNT
  - INSTRMNT_RL.ACCMLTD_IMPRMNT
  - INSTRMNT_RL.FV
  - INSTRMNT_RL.ACCMLTD_CHNGS_FV
  - INSTRMNT_RL.GNRL_ALLWNCS_BNK_RSK
  - INSTRMNT_RL.GNRL_ALLWNCS_CRDT_RSK
  - INSTRMNT_RL.IMPRMNT_STTS
  - INSTRMNT_RL.PRFRMNG_STTS
  - INSTRMNT_RL.SBJCT_IMPRMNT_INDCTR
  - INSTRMNT_RL.BLNC_SHT_RCGNSD_FNNCL_ASST_INSTRMNT_FR_VL_TYP
  outputs:
  - stg_instrument_role.GRSS_CRRYNG_AMNT
  logic:
    type: case
    guard: only INSTRMNT_RL_TYP in ('10','34','35') feed carrying amount, impairment and status; FV inputs only when the fair-value
      type flag is set; general allowances only when INSTRMNT_RL_TYP = '34'
    branches:
    - when: ACCNTNG_CLSSFCTN in ('4','41','47','7') and PRFRMNG_STTS = '11'
      then: FV
    - when: ACCNTNG_CLSSFCTN in ('4','41','47','7') and PRFRMNG_STTS = '1'
      then: FV + ACCMLTD_CHNGS_FV
    - when: ACCNTNG_CLSSFCTN in ('6','8','9')
      then: CRRYNG_AMNT - ACCMLTD_IMPRMNT
      flag: OI-01
    - when: ACCNTNG_CLSSFCTN = '77' and IMPRMNT_STTS = '26'
      then: CRRYNG_AMNT - ACCMLTD_IMPRMNT
    - when: ACCNTNG_CLSSFCTN = '77' and IMPRMNT_STTS = '211'
      then: CRRYNG_AMNT - GNRL_ALLWNCS_CRDT_RSK
    - when: ACCNTNG_CLSSFCTN = '77' and IMPRMNT_STTS = '212'
      then: CRRYNG_AMNT - GNRL_ALLWNCS_BNK_RSK
    - when: ACCNTNG_CLSSFCTN in ('76','73')
      then: CRRYNG_AMNT
    - when: ACCNTNG_CLSSFCTN = '74'
      then: CRRYNG_AMNT + ACCMLTD_IMPRMNT
    - when: ACCNTNG_CLSSFCTN in ('2','3')
      then: FV
    - else: '0'
  business_group: MEASUREMENT
  provenance: bird_extracted
  source_file: artefacts/derivation_files/manually_generated/INSTRMNT_RL_GRSS_CRRYNG_AMNT_derived.py
  open_issues:
  - OI-01
  - OI-02
- id: T04
  name: Assign FINREP product slice
  layer: staging
  inputs:
  - INSTRMNT.INSTRMNT_TYP_PRDCT
  outputs:
  - stg_instrument.product_slice
  logic:
    type: lookup
    mapping:
    - slice: Advances that are not loans
      main_table: INSTRMNT
      product_filter_code: ADVNC
      related_tables:
      - INSTRMNT_RL
      - PRTY
      - INSTRMNT_ENTTY_RL_ASSGNMNT
      - CLLTRL
    - slice: Other loans
      main_table: INSTRMNT
      product_filter_code: OTHR_LN
      related_tables:
      - INSTRMNT_RL
      - PRTY
      - INSTRMNT_ENTTY_RL_ASSGNMNT
      - CLLTRL
    - slice: Credit card debt
      main_table: INSTRMNT
      product_filter_code: CRDT_CRD_DBT
      related_tables:
      - INSTRMNT_RL
      - PRTY
      - INSTRMNT_ENTTY_RL_ASSGNMNT
      - CLLTRL
    - slice: Trade receivables
      main_table: INSTRMNT
      product_filter_code: TRD_RCVBL
      related_tables:
      - INSTRMNT_RL
      - PRTY
      - INSTRMNT_ENTTY_RL_ASSGNMNT
      - CLLTRL
    - slice: Finance leases
      main_table: INSTRMNT
      product_filter_code: FNNCL_LS
      related_tables:
      - INSTRMNT_RL
      - PRTY
      - INSTRMNT_ENTTY_RL_ASSGNMNT
      - CLLTRL
    - slice: On demand and short notice
      main_table: INSTRMNT
      product_filter_code: ON_DMND
      related_tables:
      - INSTRMNT_RL
      - PRTY
      - INSTRMNT_ENTTY_RL_ASSGNMNT
    - slice: Reverse repurchase agreements
      main_table: INSTRMNT
      product_filter_code: RVRS_RPCHS_LNS
      related_tables:
      - INSTRMNT_RL
      - PRTY
      - INSTRMNT_ENTTY_RL_ASSGNMNT
  business_group: PRODUCT_SEGMENTATION
  provenance: bird_extracted
  source_file: artefacts/joins_configuration/join_for_product_il_definitions_FINREP_REF.csv
  description: Loans-and-advances slices of F 18.00.a; the Debt securities slice is excluded for row 0070.
