# ---------- template routines ----------
- routine: R_F_18.00.a_ALL
  kind: structure
  original: "Select *\nwhere\nFNRP_RPRTNG_SCHM in \n(\nFNRP_RPRTNG_SCHM_1, \nFNRP_RPRTNG_SCHM_2, \nFNRP_RPRTNG_SCHM_3\n);"
  corrected: "reporting contexts (DT_RFRNC, RPRTNG_AGNT_ID, ACCNTNG_CNSLDTN_LVL, ACCNTNG_STNDRD) whose INTRNL_GRP_RL_EIL row with GRP_RL_TYP = 'GRP_RL_TYP_1' has FNRP_RPRTNG_SCHM in (1, 2, 3); positions are joined to these contexts"
  reason: FNRP_RPRTNG_SCHM is not an attribute of positions. Join as decided for OI-13 (decisions.md).
  occurrences: 1
- routine: [R_F_18.00.a_R0080, R_F_18.00.a_R0090, R_F_18.00.a_R0100, R_F_18.00.a_R0110, R_F_18.00.a_R0120, R_F_18.00.a_R0150]
  kind: structure
  original: "Update DataPointCube\nset\nTYP_FNNCL_ASST_INSTRMNT_ANNX_V = TYP_INSTRMNT_1117,\nACCNTNG_CLSSFCTN = ACCNTNG_CLSSFCTN_531,\nINSTTTNL_SCTR = ...\nwhere ..."
  corrected: "SELECT datapoint records WHERE <same predicate>, tagged with the row code"
  reason: The 'set' clause relabels the record with the cell's aggregate members; it does not change amounts. The predicate is kept literally. The datapoint record joins each position to its entity-role assignments and counterparty.
  occurrences: 6
- routine: R_F_18.00.a_R0110
  kind: missing_member
  original: "INSTTTNL_SCTR in (INSTTTNL_SCTR_S123, INSTTTNL_SCTR_S124, INSTTTNL_SCTR_S125_*, INSTTTNL_SCTR_S127, INSTTTNL_SCTR_S128, INSTTTNL_SCTR_S129, INSTTTNL_SCTR_S122_B1, INSTTTNL_SCTR_S122_B2)"
  corrected: "same list plus 'INSTTTNL_SCTR_S126'"
  reason: Financial auxiliaries (S126, under S12_D in the BIRD member hierarchy) are other financial corporations per Annex V, Part 1, paragraph 42(d) of Implementing Regulation (EU) 2021/451; the official list omits them, so they fell in no sector row. Decided as OI-15 (decisions.md).
  occurrences: 1
- routine: R_F_18.00.a_R0070
  kind: structure
  original: "SUM(R0080, R0090, R0100, R0110, R0120, R0150)"
  corrected: "row 0070 records = all records of the six sector rows (UNION ALL); cells sum over them"
  reason: Sum of rows expressed at record level, so column filters apply once (decision OI-10).
  occurrences: 1
- routine: [R_F_18.00.a_C0010, R_F_18.00.a_C0060]
  kind: structure
  original: "Update DataPointCube\nset\nGRSS_CRRYNG_AMNT = GRSS_CRRYNG_AMNT ...\nwhere\nGRSS_CRRYNG_AMNT > 0 ..."
  corrected: "SELECT SUM(GRSS_CRRYNG_AMNT) ... WHERE <same predicate>"
  reason: The cell value is the sum of the metric over the records that satisfy the predicate.
  occurrences: 2
- routine: R_F_18.00.a_C0060
  kind: syntactic
  original: "member identifiers as bare names"
  corrected: "member identifiers as string literals"
  reason: Coded attributes hold the member id as text.
  occurrences: all
