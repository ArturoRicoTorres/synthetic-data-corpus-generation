  - INSTRMNT_RL_EIL.PRFRMNG_STTS
  - SCRTY_EXCHNG_TRDBL_DRVTV_EIL.DBT_SCRTY_PRFRMNG_STTS_TYP
  - GRSS_CRRYNG_AMNT
  outputs:
  - cell F_18.00.a R0070 C0060
  logic:
    type: aggregate
    function: sum
    filter: GRSS_CRRYNG_AMNT > 0 and (PRFRMNG_STTS = CRDT_QLTY_1 or DBT_SCRTY_PRFRMNG_STTS_TYP = SCRTY_EXCHNG_TRDBL_DRVTV_TYP_20)
    official_algorithm: |-
      Update DataPointCube
      set
      GRSS_CRRYNG_AMNT = GRSS_CRRYNG_AMNT,
      PRFRMNG_STTS = CRDT_QLTY_1
      where
      GRSS_CRRYNG_AMNT > 0
      and
      (PRFRMNG_STTS = CRDT_QLTY_1
      or
      DBT_SCRTY_PRFRMNG_STTS_TYP = SCRTY_EXCHNG_TRDBL_DRVTV_TYP_20);
  business_group: CREDIT_QUALITY_CLASSIFICATION
  provenance: bird_official
- id: T11
  name: Compute NPL ratio
  layer: kri
  inputs:
  - cell F_18.00.a R0070 C0060
  - cell F_18.00.a R0070 C0010
  outputs:
  - kri.NPL_RATIO
  logic:
