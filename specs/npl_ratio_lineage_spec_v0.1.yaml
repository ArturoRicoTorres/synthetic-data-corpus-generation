  - OI-04
- id: T07
  name: Union product slices
  layer: staging
  inputs:
  - stg_loan_position
  outputs:
  - F_18_00_a_union
  logic:
    type: union_all
    parts:
    - Advances that are not loans
    - Other loans
    - Credit card debt
    - Trade receivables
    - Finance leases
    - On demand and short notice
    - Reverse repurchase agreements
  business_group: TECHNICAL
  provenance: bird_extracted
  source_file: artefacts/filter_code/staging/F_18_00_a_REF_FINREP_3_0_logic.py
- id: T08
  name: Apply F 18.00 reporting perimeter
  layer: reporting
  inputs:
  - F_18_00_a_union
  outputs:
  - F_18_00_a_r0070_scope
  logic:
    type: filter
    conditions:
    - variable: ACCNTNG_CLSSFCTN
      in:
      - '6'
      - '74'
      - '76'
      - '77'
      meaning: cost / amortised cost portfolios (node ACCNTNG_CLSSFCTN_531)
    - variable: HLD_SL_INDCTR
      eq: '2'
      meaning: not held for sale
    - variable: SBJCT_IMPRMNT_INDCTR
      eq: '1'
      meaning: subject to impairment
    - variable: TYP_INSTRMNT
      in:
      - '1003'
      - '1020'
      - '1022'
      - '1023'
      - '120'
      - '1201'
      - '1202'
      - '130'
      - '140'
      - '214'
      - '30'
      - '51'
      - '511'
      - '512'
      - '522'
      - '80'
      meaning: loans and advances (node TYP_INSTRMNT_251)
    - variable: PRTY_RL_TYP
      in:
      - '18'
      - '19'
      - '28'
      - '4'
      - '8'
      meaning: debtor-side roles (node ENTTY_RL_TYP_46)
    - variable: MN_DBTR_INDCTR
      eq: '1'
      meaning: main debtor
    - variable: NGTBL_SCRTY_INDCTR
      eq: '2'
      meaning: non-negotiable
    - variable: IMPRMNT_STTS
      in:
      - '23'
      - '24'
      - '25'
      - '26'
      meaning: IFRS stage 1/2/3 or nGAAP specific allowance (node CRDT_QLTY_17)
    - variable: DFLT_STTS
      in:
      - '0'
      - '14'
      - '18'
      - '19'
      - '20'
      meaning: any default status
    - variable: TYP_CLLTRL
      node: TYP_PRTCTN_1
      meaning: see OI-05
  business_group: REGULATORY_SCOPE
  provenance: bird_extracted
  note: Codes are BIRD reference members with the domain prefix removed; that they equal input-layer codes is an assumption
    (OI-06).
  open_issues:
  - OI-05
  - OI-06
  - OI-07
- id: T09
  name: Classify performing vs non-performing
  layer: reporting
  inputs:
  - F_18_00_a_r0070_scope.PRFRMNG_STTS
  outputs:
  - F_18_00_a_r0070_scope.npe_flag
  logic:
    type: case
    branches:
    - when: PRFRMNG_STTS in leaves(CRDT_QLTY_1)
      then: NON_PERFORMING
    - else: PERFORMING_OR_NA
  business_group: CREDIT_QUALITY_CLASSIFICATION
  provenance: bird_extracted
  open_issues:
  - OI-02
  - OI-06
- id: T10
  name: Aggregate F 18.00.a r0070 c0010
  layer: reporting
  inputs:
  - F_18_00_a_r0070_scope.GRSS_CRRYNG_AMNT
  outputs:
  - cell.F18_00_a.r0070.c0010
  logic:
    type: aggregate
    function: sum
    filter: PRFRMNG_STTS in leaves(CRDT_QLTY_15)
  business_group: AGGREGATION
  provenance: bird_extracted
- id: T11
  name: Aggregate F 18.00.a r0070 c0060
  layer: reporting
  inputs:
  - F_18_00_a_r0070_scope.GRSS_CRRYNG_AMNT
  - F_18_00_a_r0070_scope.npe_flag
  outputs:
  - cell.F18_00_a.r0070.c0060
  logic:
    type: aggregate
    function: sum
    filter: npe_flag = 'NON_PERFORMING'
  business_group: AGGREGATION
  provenance: bird_extracted
- id: T12
  name: Compute NPL ratio
  layer: kri
  inputs:
  - cell.F18_00_a.r0070.c0060
  - cell.F18_00_a.r0070.c0010
  outputs:
  - kri.NPL_RATIO
  logic:
    type: expression
    expr: c0060 / NULLIF(c0010, 0)
  business_group: KRI_CALCULATION
  provenance: gap_fill
  open_issues:
  - OI-07
open_issues:
- id: OI-01
  node: T03
  severity: high
  issue: For amortised cost (ACCNTNG_CLSSFCTN 6) the derivation computes CRRYNG_AMNT - ACCMLTD_IMPRMNT, while the nGAAP branch
    '74' uses CRRYNG_AMNT + ACCMLTD_IMPRMNT. ACCMLTD_IMPRMNT is typed as a non-negative amount, so gross = net + allowance
    would suggest '+'. Confirm the sign convention.
- id: OI-02
  node: T03
  severity: medium
  issue: Case '9' appears twice in the derivation; the second branch is unreachable. Inside it, PRFRMNG_STTS is matched against
    impairment codes ('26','211','212'), which looks like it was meant to be IMPRMNT_STTS.
- id: OI-03
  node: T05/T06
  severity: medium
  issue: The generated F 18.00.a staging code lists the tables to join but the calc_* methods are empty stubs. Join keys here
    come from the LDM foreign keys.
- id: OI-04
  node: T06
  severity: high
  issue: In the generated product classes PRFRMNG_STTS and DFLT_STTS are defined twice (from INSTRMNT_RL and from PRTY). In
    Python the later (PRTY) definition wins, so performing status would be taken at counterparty level, not instrument level.
    Decide which one the KRI uses.
- id: OI-05
  node: T08
  severity: high
  issue: The cell filter constrains TYP_CLLTRL to node TYP_PRTCTN_1. Joining collateral with an inner join would drop unsecured
    loans and a plain join can fan out amounts per collateral item. The collateral join was left out of T06; confirm whether
