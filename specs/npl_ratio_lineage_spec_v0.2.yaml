      )
      )
      and
      CRRYNG_AMNT <> null
      then
      CRRYNG_AMNT
      );
      or
      (
      set
      GRSS_CRRYNG_AMNT =
      case when
      (
      FV = null
      and
      CRRYNG_AMNT = null
      )
      then
      null;
