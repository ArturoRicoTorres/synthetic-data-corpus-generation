  logic:
    type: identity
    routine: R_IDT_DER
  business_group: TECHNICAL
  provenance: bird_official
- id: T03
  name: Derive gross carrying amount (loans)
  layer: enrichment
  inputs:
  - INSTRMNT_RL_IL.ACCMLTD_CHNGS_FV_CR
  - INSTRMNT_RL_IL.ACCMLTD_IMPRMNT
  - INSTRMNT_RL_IL.ACCNTNG_CLSSFCTN
  - INSTRMNT_RL_IL.CRRYNG_AMNT
  - INSTRMNT_RL_IL.FV
  - INSTRMNT_RL_IL.GNRL_ALLWNCS_BNK_RSK
  - INSTRMNT_RL_IL.GNRL_ALLWNCS_CRDT_RSK
  - INSTRMNT_RL_IL.IMPRMNT_STTS
  - INSTRMNT_RL_IL.PRFRMNG_STTS
  - INSTRMNT_RL_IL.SBJCT_IMPRMNT_INDCTR
  outputs:
  - INSTRMNT_RL_EIL.GRSS_CRRYNG_AMNT
  routine:
  - R_DER_GRSS_CRRYNG_AMNT_3
  logic:
    type: case
    in_scope_branches_for_R0070:
    - when: ACCNTNG_CLSSFCTN in (6, 8)
      then: CRRYNG_AMNT + ACCMLTD_IMPRMNT
      requires: CRRYNG_AMNT and ACCMLTD_IMPRMNT not null
    - when: ACCNTNG_CLSSFCTN in (76, 77, 44) and IMPRMNT_STTS = CRDT_QLTY_26
      then: CRRYNG_AMNT + ACCMLTD_IMPRMNT
    - when: ACCNTNG_CLSSFCTN in (9, 73, 74) and SBJCT_IMPRMNT_INDCTR = 1 and IMPRMNT_STTS = CRDT_QLTY_26
      then: CRRYNG_AMNT + ACCMLTD_IMPRMNT
    - when: ACCNTNG_CLSSFCTN in (76, 77, 44) and IMPRMNT_STTS in (CRDT_QLTY_211, CRDT_QLTY_212)
      then: CRRYNG_AMNT + GNRL_ALLWNCS_CRDT_RSK + GNRL_ALLWNCS_BNK_RSK
    - when: ACCNTNG_CLSSFCTN in (9, 73, 74) and SBJCT_IMPRMNT_INDCTR = 1 and IMPRMNT_STTS in (CRDT_QLTY_211, CRDT_QLTY_212)
      then: CRRYNG_AMNT + GNRL_ALLWNCS_CRDT_RSK + GNRL_ALLWNCS_BNK_RSK
    - else: no value (fair-value branches exist but are outside ACCNTNG_CLSSFCTN_531)
    official_algorithm: |-
      update cubes --(destination cubes: INSTRMNT_RL_EIL)
      -- The derivation logic is defined in accordance with Annex V
      (
      set
      GRSS_CRRYNG_AMNT =
      case when
      (
      ACCNTNG_CLSSFCTN in (ACCNTNG_CLSSFCTN_2, ACCNTNG_CLSSFCTN_3)
      or
      (
      ACCNTNG_CLSSFCTN in (ACCNTNG_CLSSFCTN_41, ACCNTNG_CLSSFCTN_4, ACCNTNG_CLSSFCTN_7, ACCNTNG_CLSSFCTN_49)
      and
      PRFRMNG_STTS = CRDT_QLTY_11
      )
      or
      (
      ACCNTNG_CLSSFCTN = ACCNTNG_CLSSFCTN_9
      and
      SBJCT_IMPRMNT_INDCTR = SBJCT_IMPRMNT_INDCTR_2
      and
      PRFRMNG_STTS = CRDT_QLTY_11
      )
      )
      and
      FV <> null
      then
      FV
      )
      or
      (
      set
      GRSS_CRRYNG_AMNT =
      case when
      (
      (
      ACCNTNG_CLSSFCTN in (ACCNTNG_CLSSFCTN_41, ACCNTNG_CLSSFCTN_4, ACCNTNG_CLSSFCTN_7, ACCNTNG_CLSSFCTN_49)
      and
      PRFRMNG_STTS = CRDT_QLTY_1
      )
      or
      (
      ACCNTNG_CLSSFCTN = ACCNTNG_CLSSFCTN_9
      and
      SBJCT_IMPRMNT_INDCTR = SBJCT_IMPRMNT_INDCTR_2
      and
      PRFRMNG_STTS = CRDT_QLTY_1
      )
      )
      and
      FV <> null
      and
      ACCMLTD_CHNGS_FV_CR < 0
      then
      FV - ACCMLTD_CHNGS_FV_CR
      )
      or
      (
      set
      GRSS_CRRYNG_AMNT =
      case when
      (
      ACCNTNG_CLSSFCTN in (ACCNTNG_CLSSFCTN_8, ACCNTNG_CLSSFCTN_6)
      or
      (
      ACCNTNG_CLSSFCTN in (ACCNTNG_CLSSFCTN_76, ACCNTNG_CLSSFCTN_77, ACCNTNG_CLSSFCTN_44)
      and
      IMPRMNT_STTS = CRDT_QLTY_26
      )
      or
      (
      ACCNTNG_CLSSFCTN in (ACCNTNG_CLSSFCTN_9, ACCNTNG_CLSSFCTN_73, ACCNTNG_CLSSFCTN_74)
      and
