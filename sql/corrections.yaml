# Corrections applied when translating the official BIRD algorithms (pseudo-SQL) into the reference SQL.
# Policy: fix unambiguous defects only; everything else is translated literally, including parent members
# and NULL arithmetic (see decisions.md).
# kind: syntactic | structure | identifier | missing_variable | wrong_cube | missing_member

corrections:

# ---------- gross carrying amount, instrument roles ----------
- routine: R_DER_GRSS_CRRYNG_AMNT_3
  kind: structure
  original: "update cubes ( set GRSS_CRRYNG_AMNT = case when ... then FV ) or ( set GRSS_CRRYNG_AMNT = case when ... ) ...; or ( set ... then null;"
  corrected: "one SELECT computing GRSS_CRRYNG_AMNT with a single CASE whose WHEN branches keep the original order"
  reason: The routine is written as a chain of 'set ... case when' blocks joined by 'or', with unbalanced parentheses and a stray ';'. Read as ordered alternatives, it is one CASE expression.
  occurrences: 1
- routine: R_DER_GRSS_CRRYNG_AMNT_3
  kind: syntactic
  original: "<> null / = null"
  corrected: "IS NOT NULL / IS NULL"
  reason: Comparison with null is always unknown in SQL; the intent is a null test.
  occurrences: 10
- routine: R_DER_GRSS_CRRYNG_AMNT_3
  kind: missing_variable
  original: "ACCNTNG_CLSSFCTN_73\nand\nSBJCT_IMPRMNT_INDCTR = SBJCT_IMPRMNT_INDCTR_2 -- Measured at cost"
  corrected: "ACCNTNG_CLSSFCTN = 'ACCNTNG_CLSSFCTN_73' AND SBJCT_IMPRMNT_INDCTR = 'SBJCT_IMPRMNT_INDCTR_2'"
  reason: Member used as a predicate without its variable.
  occurrences: 1
- routine: R_DER_GRSS_CRRYNG_AMNT_3
  kind: missing_variable
  original: "ACCNTNG_CLSSFCTN_44\nand\nIMPRMNT_STTS not in (CRDT_QLTY_26, CRDT_QLTY_211, CRDT_QLTY_212) -- Measured at cost"
  corrected: "ACCNTNG_CLSSFCTN = 'ACCNTNG_CLSSFCTN_44' AND IMPRMNT_STTS NOT IN ('CRDT_QLTY_26', 'CRDT_QLTY_211', 'CRDT_QLTY_212')"
  reason: Member used as a predicate without its variable.
  occurrences: 1
- routine: R_DER_GRSS_CRRYNG_AMNT_3
  kind: syntactic
  original: "member identifiers as bare names, e.g. ACCNTNG_CLSSFCTN in (ACCNTNG_CLSSFCTN_8, ACCNTNG_CLSSFCTN_6)"
  corrected: "member identifiers as string literals, e.g. ACCNTNG_CLSSFCTN IN ('ACCNTNG_CLSSFCTN_8', 'ACCNTNG_CLSSFCTN_6')"
  reason: Coded attributes hold the member id as text.
  occurrences: all

