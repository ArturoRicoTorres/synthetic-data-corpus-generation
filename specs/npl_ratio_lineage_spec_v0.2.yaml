open_issues:
- id: OI-01
  status: RESOLVED
  resolution: Official uses CRRYNG_AMNT + ACCMLTD_IMPRMNT. The community derivation had the sign wrong.
- id: OI-02
  status: RESOLVED
  resolution: Official branches use IMPRMNT_STTS; the community code's duplicate case and PRFRMNG_STTS match were errors.
- id: OI-03
  status: RESOLVED
  resolution: Join keys confirmed by official cube relationships.
- id: OI-04
  status: RESOLVED
  resolution: Official attribute lineage takes PRFRMNG_STTS from INSTRMNT_RL (instrument level).
- id: OI-05
  status: RESOLVED
  resolution: No collateral filter in the official cells; collateral is not part of this lineage.
- id: OI-06
  status: RESOLVED
  resolution: Official algorithms use member IDs directly (e.g. CRDT_QLTY_1), so no code mapping is needed.
- id: OI-07
  status: DECIDED
  decision: see decisions.md
  resolution: Official cell description confirms row 0070 sits under 'debt instruments at cost or at amortised cost'. Still
    decide whether the KRI is this cell ratio or a wider headline ratio.
- id: OI-08
  status: RESOLVED
  resolution: Official export has algorithm text for every routine and business definitions for variables.
- id: OI-09
  status: DECIDED
  decision: see decisions.md
  severity: medium
  issue: 'Official algorithms are pseudo-SQL, not executable, and contain defects (see algorithm_validation): identifiers
    that exist nowhere in the export, and predicates that name a member without its variable. They must be normalised when
    rendering SQL; record each fix.'
- id: OI-10
  status: DECIDED
  decision: see decisions.md
  severity: medium
  issue: Official attribute lineage for the R0070 cells omits the counterparty attributes that the sector rows use (8 source
    attributes, see lineage_gap_at_total_row). Model R0070 as the sum of sector rows (T08) so lineage is complete.
- id: OI-11
  status: DECIDED
  decision: see decisions.md
  severity: low
  issue: GRSS_CRRYNG_AMNT gets no value for an amortised-cost loan whose ACCMLTD_IMPRMNT is null; the C0010/C0060 filter GRSS_CRRYNG_AMNT
    > 0 then silently drops it. Decide whether null impairment is treated as zero in the synthetic data.
- id: OI-12
  status: DECIDED
  decision: see decisions.md
  severity: low
  issue: Official algorithms reference portfolios and products (e.g. ACCNTNG_CLSSFCTN_44, 8, 9, 73) outside the R0070 scope;
    the spec keeps only in-scope branches as structured logic and the full text verbatim.
- id: OI-13
  status: DECIDED
  decision: see decisions.md
  severity: medium
  issue: FNRP_RPRTNG_SCHM sits on INTRNL_GRP_RL, which has no relationship to instruments. The gate is joined on the context
    key; which GRP_RL_TYP row applies is not specified.
- id: OI-14
  status: OPEN
  severity: low
  issue: Legal references cite Implementing Regulation (EU) No 680/2014, which was replaced by Implementing Regulation (EU)
    2021/451. Confirm citations before writing the Collibra and regulatory documents.
- id: OI-15
  status: OPEN
  severity: medium
  issue: INSTTTNL_SCTR_S126 (financial auxiliaries) sits under INSTTTNL_SCTR_S12_D in the member hierarchy but is missing
    from the member list of official routine R_F_18.00.a_R0110. Read literally, loans to financial auxiliaries fall in no
    sector row and drop out of R0070.
- id: OI-16
  status: OPEN
  severity: medium
  issue: R_F_18.00.a_R0100 selects MLTLTRL_DVLPMNT_BNK_INDCTR_1 regardless of sector, and R_F_18.00.a_R0090 selects general-government
    sectors without excluding multilateral development banks. A development bank party with a general-government sector is
    counted in both rows, so the R0070 sum counts it twice.
- id: OI-17
  status: OPEN
  severity: medium
  issue: Official algorithms compare against parent members while input data may hold their leaves (and vice versa). R_DER_TYP_FNNCL_ASST_INSTRMNT_ANNX_V_2
    excludes INSTTTNL_SCTR_S122_A, but input may hold S122_A_1/S122_A_2; the sector rows list leaves only, so a party stored
    as parent S14 or S122_A matches no row. The SQL compares members literally (OI-09).
- id: OI-18
  status: OPEN
  severity: low
  issue: The general-allowances branch of R_DER_GRSS_CRRYNG_AMNT_1/_3 fires when either GNRL_ALLWNCS_CRDT_RSK or GNRL_ALLWNCS_BNK_RSK
    is not null, but CRRYNG_AMNT + GNRL_ALLWNCS_CRDT_RSK + GNRL_ALLWNCS_BNK_RSK is null when one of them is null, so the position
    drops out. The SQL keeps the literal arithmetic (OI-09).
